name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build Web App
        run: |
          # Client index.html ko root me direct link karo with proper path
          cp client/index.html ./index.html
          sed -i 's|src="/src/main.tsx"|src="/client/src/main.tsx"|g' index.html
          # Frontend static build
          npx vite build --outDir dist

      - name: Initialize Capacitor
        run: |
          npx cap init AutoVista com.autovista.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoVista-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
